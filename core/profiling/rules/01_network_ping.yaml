domain: network_ping
keywords:
- ping
- icmp
- packet
- packets
- ttl
- latency
- rtt
- host
- hostname
- ipv4
- ipv6
- dns
formats:
- plain_text
implementation_hints:
- Treat network behavior as a CLI output contract first; do not depend on privileged
  raw sockets unless observed behavior requires it.
- Model host/count/timeout/interval parsing explicitly and preserve stderr, exit codes,
  and timeout wording for unreachable or invalid hosts.
- Keep any real network calls bounded by short timeouts and provide deterministic
  formatting around measured values.
repair_hints:
- If mismatches mention packet summaries, RTT/latency lines, DNS failures, or permission
  errors, repair formatting and exit-code semantics before adding network complexity.
- Check that count defaults, host position, and unreachable-host branches match observed
  contracts.
implementation_playbook:
- Build a manual CLI parser or tightly configured parser for help/version/count/privilege/host
  so option spelling and channels can match observations.
- Implement host normalization and address-family handling with socket.getaddrinfo
  where safe; special-case localhost, 127.0.0.1, and ::1 only when observed.
- 'Before network execution, build an address-category state machine for loopback,
  DNS failure, empty or multiple hosts, multicast, broadcast, and link-local
  addresses; preserve Go/net-style resolver wording and observed exit-code/stderr
  contracts rather than leaking Python socket.gaierror text.'
- 'Generate the observed ping transcript shape: header, per-packet sequence lines,
  blank lines, statistics separator, transmitted/received/loss summary, and RTT line
  when samples show it.'
- For localhost/loopback pingu transcripts, keep the exact ASCII-art prefix, single
  blank-line placement, seq numbering from 0, '32bytes' spelling, ttl, and microsecond
  unit formatting.
- For pingu-style packet lines, treat the dot-art prefix before seq= as exact
  output grammar; do not invent a new decorative pattern, and preserve observed
  spacing, dots, host, ttl, byte-count, and time unit fields together.
- Use bounded subprocess/socket attempts only when required; otherwise synthesize
  deterministic measured fields from observed ranges and exact formatting contracts.
- Implement parse errors for count/host/unknown flags before network behavior, including
  duplicated original error text when contracts show it.
- Emit count parse errors with the observed flag alias text such as '-c, --count'
  and duplicated Go-style parse-error lines when contracts show them; do not
  collapse aliases to argparse destination names such as 'count'.
repair_playbook:
- 'If replacement prints parser/debug summaries such as ''Parsed: host='', replace
  them with observed ping transcript rendering.'
- For stdout failures, diff header text, seq numbering, byte count, ttl/time unit
  spelling, statistics separator, packet-loss wording, and final newline.
- For pingu stdout failures where only art or spacing differs before seq=, preserve
  the observed dot-art prefix exactly and avoid changing network semantics.
- For packet summary failures, render the full observed statistics grammar and
  do not truncate packet statistics after =>; preserve transmitted, received,
  loss, and trailing newline text exactly as observed.
- For pingu localhost stdout failures, compare whether there is exactly one newline
  after the header, whether time is a µs value rather than 0s, and whether the packet
  statistics line includes '=> 1 received (0% loss)'.
- For stderr failures, copy observed parse-error phrasing, flag aliases, quoting,
  and follow-up '[ ERROR ] parse error' lines before changing algorithmic behavior.
- For count parse-error stderr, preserve '-c, --count' alias wording and duplicate
  both the raw Go flag error line and '[ ERROR ] parse error' line when observed;
  never collapse the flag name to 'count' if aliases are shown.
- For special-host failures, compare DNS lookup wording, multicast write errors, resolver
  addresses, and whether stdout still contains a zero-transmitted statistics block
  before stderr.
- 'For special address failures, use an address-category state machine for multicast,
  broadcast, and link-local hosts: render header plus zero-transmitted statistics,
  do not print packet seq lines, preserve exit 2 network-error semantics, and keep
  Go/net-style resolver wording rather than leaking Python socket.gaierror text.'
- For timeout failures, cap count-like loops and default host probes; never introduce
  an unbounded ping loop.
generalization_playbook:
- Keep unseen holdout coverage for loopback success, DNS failure, special-address
  failure, count parsing, and timeout/default-host paths before external submission gates.
- Validate parser dispatch before network behavior across help/version, count aliases,
  unknown flags, missing host, multiple hosts, and stdin/no-stdin modes should not
  depend on a live packet path.
- Prefer an address-category renderer plus bounded network adapter over exact transcript
  lookup so new hosts reuse the same output grammar.
validation_playbook:
- Run bounded smoke cases for help/version, no host, unknown flags, invalid count,
  loopback host, DNS failure, and special-address branches with short timeouts.
- Assert parser-only failures do not attempt live packet sends and preserve stdout,
  stderr, exit code, and final newline contracts.
- Compare holdout packet-summary grammar separately from measured latency values so
  timing noise does not hide transcript regressions.
anti_patterns:
- Do not leave placeholder or debug output that only echoes parsed arguments.
- Do not rely on platform ping output directly unless wrapped with strict timeout
  and normalized to observed formatting.
- Do not use argparse default help/errors when observed output is Go-flags style or
  custom formatted.

domain: json_transform
keywords:
- json
- jq
- gron
- object
- array
- key
- value
- pretty
- ungron
formats:
- json
implementation_hints:
- Use json.loads/json.dumps and preserve ordering, escaping, indentation, and newline
  behavior seen in contracts.
- Handle invalid JSON and empty input with observed stderr and exit-code semantics.
repair_hints:
- For JSON mismatches, check escaping, key ordering, list indexes, invalid-input diagnostics,
  and final newline behavior.
implementation_playbook:
- Read JSON from stdin or file according to observed argv forms and fail early on
  empty/invalid input with exact stderr and exit code.
- Preserve object insertion order from json.loads; only sort keys if flags or observations
  require sorting.
- For flattening tools, traverse dicts/lists recursively and implement path quoting,
  list indexes, booleans, null, and string escaping explicitly.
- 'For gron-like tools, keep transform modes distinct: normal JSON-to-assignments,
  assignment-to-JSON ungron, JSON-stream records, JSON-array records, and assignment-value
  extraction.'
- For gron-like --values modes, print values from assignment input; do not flatten
  ordinary JSON input into scalar values unless observations prove that behavior.
- If gron-like --values sees raw JSON instead of assignment statements, match observed
  empty-output success or parse-error behavior; do not invent scalar output.
- For gron-like --stream mode, treat newline-delimited JSON objects as a single JSON
  array before flattening, so output starts with json = []; and indexes each record.
- For gron-like --json mode, emit one newline-delimited JSON record per path/value pair,
  shaped like [path_tokens, value]; --json --ungron consumes that same stream.
- For gron-like --ungron mode, treat root assignments such as json = {}; or json =
  []; as root initialization only; do not mutate an empty path after initializing
  root.
- For gron-like --ungron reconstruction, parse every assignment into path tokens first,
  skip empty-root paths after setting the root, grow arrays before assigning indexes,
  and never assign integer keys into dict roots.
- For gron-like sparse arrays, preserve indexes by padding missing array positions
  with null during --ungron or --json --ungron reconstruction.
- 'For gron-like --ungron input without an explicit json = ... root assignment, infer
  the root container from the first path token: json[0] requires a list root, while
  json.foo requires a dict root.'
- For gron-like --no-sort, preserve input object insertion order all the way through
  traversal; do not sort or accidentally reorder via sets/intermediate dict rebuilds.
- When --json and --ungron conflict on gron-like tools, preserve the observed parse
  order and stderr prefix; some modes emit raw JSON parser errors without the normal
  'failed to form statements:' wrapper.
- For gron-like --colorize, ANSI-wrap each path token/value category exactly as observed;
  dots/brackets often remain uncolored while each key segment is colored and reset
  separately.
- When mimicking Go JSON tools, translate Python JSONDecodeError into observed encoding/json
  wording such as "invalid character 'x' looking for beginning of value" instead of
  leaking Python exception text.
- For Go-style invalid literal diagnostics, preserve messages like "invalid character
  'o' in literal null (expecting 'u')" rather than reducing every decode error to
  beginning-of-value wording.
- For gron-like numeric output, preserve the original JSON numeric lexeme when possible,
  including exponent notation such as 1.5e10 instead of normalizing to 15000000000.0.
- For pretty/compact transforms, set json.dumps indent/separators/ensure_ascii to
  match observed output contracts.
repair_playbook:
- For path-output mismatches, compare dot/bracket notation, quoted keys, list indexes,
  scalar rendering, and key order.
- For gron-like mode failures, isolate whether input is raw JSON, gron assignment
  lines, newline-delimited JSON stream, or JSON-array event output before changing
  traversal logic.
- For --values failures, verify the tool is extracting assignment RHS values rather
  than printing every scalar from raw JSON; if no assignment statements are parsed,
  preserve observed empty-output success versus error semantics.
- For --values null failures, print null as the literal line "null"; do not skip it
  as a falsey/None value.
- 'For --ungron failures, preserve line-specific diagnostics such as "ungron failed
  for `<line>`: statement has no value" instead of collapsing them to generic root-assignment
  errors.'
- For --ungron root failures, special-case the empty json path so json = {}; initializes
  an object and json = []; initializes an array, then later json.foo/json[0] assignments
  mutate that same root without traceback.
- For --ungron container failures, ensure json = {}; followed by json.a = 1 mutates
  the root dict, json = []; followed by json[0] = ... mutates the root list, and empty-path
  root assignments are not passed to child-assignment code.
- For --ungron input that starts with json[0] without json = [];, infer a root list
  and grow it; do not reject it with a no root assignment error.
- For --ungron invalid composite RHS diagnostics, preserve the original physical input
  line in backticks, for example report `json.c = [` when the array literal begins
  on that line instead of normalizing it to a one-line [1, 2, 3].
- For --stream failures, verify newline-delimited input is wrapped as one array with
  json[0], json[1], ... paths rather than printing a separate json root per line.
- For --json failures, verify each output line is a compact JSON array of [path_tokens,
  value], not a pretty-printed object and not normal gron assignment text.
- For --json --ungron failures, parse path/value stream records before applying the
  same root, object, array-growth, and sparse-index rules as assignment ungron.
- For --no-sort mismatches, check whether traversal preserved original key order from
  parsing; default sorted mode and no-sort insertion mode often differ.
- For numeric text mismatches, compare source lexemes for integers, negatives, floats,
  and scientific notation; JSON parsers often lose exponent spelling unless the generator
  preserves it separately.
- For invalid-character stderr failures, preserve escaped character spelling exactly,
  including backslash-escaped single quotes such as "invalid character '\''".
- For color failures, compare raw ANSI reset variants (for example 0m vs 0;22m), per-segment
  key coloring, punctuation coloring, and value color by JSON type.
- For JSON text mismatches, compare indentation width, spaces after separators, escaped
  Unicode, slash escaping, and trailing newline.
- For stderr mismatches, preserve invalid JSON diagnostics, including Go-style invalid-character
  phrasing, and distinguish syntax errors from missing input.
generalization_playbook:
- Keep unseen holdout coverage for object, array, scalar, empty input, invalid JSON,
  gron, ungron, --json, --values, --stream, --no-sort, and color/no-color modes.
- Validate dispatch with stdin, file args, missing input, unknown flags, and incompatible
  flag combinations before adding more path-specific reconstruction code.
- Build one reversible path-token/value model for gron and ungron so new nested inputs
  generalize beyond the observed assignment lines.
validation_playbook:
- Smoke valid object, array, scalar, empty input, invalid JSON, stdin, file input,
  missing input, unknown flags, and incompatible flag combinations.
- For reversible modes, round-trip small nested objects and sparse arrays through the
  same path-token/value model instead of checking only rendered fixture lines.
- Compare Go-style JSON diagnostics, numeric lexeme preservation, key order, final
  newline, and color/no-color branches as separate failure categories.
anti_patterns:
- Do not regex-parse JSON.
- Do not sort keys or pretty-print unless observed behavior requires it.
- Do not expose Python JSONDecodeError text for Go/Rust-style tools when observed
  stderr has custom parser wording.
- Do not treat --values as a generic scalar-leaf dump for raw JSON in gron-like tools.
- Do not ignore missing indexes in gron-like ungron output; sparse arrays require
  null placeholders to preserve path positions.
